    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lato:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"Inter"', '"Lato"', 'sans-serif'],
            },
            colors: {
              sand: {
                50: '#F9F8F6',
                100: '#F2F0EB',
                200: '#E6E2DA',
                300: '#D5CEC0',
                400: '#BDB3A0',
                500: '#A3967F',
                600: '#857861',
                800: '#5C5242',
                900: '#3D362B',
              },
              charcoal: {
                800: '#2C2C2C',
                900: '#1F1F1F',
              }
            },
            boxShadow: {
              'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
              'card': '0 10px 30px -5px rgba(0, 0, 0, 0.08)',
              'inner-light': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.02)',
            },
            animation: {
              'fade-in': 'fadeIn 0.8s ease-out forwards',
              'slide-up': 'slideUp 0.6s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Hide scrollbar */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      body { -webkit-tap-highlight-color: transparent; }

      /* ── GRAIN TEXTURE ── */
      .grain::after {
        content: '';
        position: fixed;
        inset: -200%;
        width: 400%;
        height: 400%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.028;
        pointer-events: none;
        z-index: 9999;
        animation: grain-move 8s steps(10, end) infinite;
      }
      @keyframes grain-move {
        0%   { transform: translate(0, 0); }
        10%  { transform: translate(-5%, -10%); }
        20%  { transform: translate(-15%, 5%); }
        30%  { transform: translate(7%, -25%); }
        40%  { transform: translate(-5%, 25%); }
        50%  { transform: translate(-15%, 10%); }
        60%  { transform: translate(15%, 0%); }
        70%  { transform: translate(0%, 15%); }
        80%  { transform: translate(3%, 35%); }
        90%  { transform: translate(-10%, 10%); }
        100% { transform: translate(0, 0); }
      }

      /* ── MAGNETIC BUTTON ── */
      .magnetic { transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1); }

      /* ── TEXT REVEAL ── */
      .text-reveal-line {
        overflow: hidden;
        display: block;
      }
      .text-reveal-line span {
        display: block;
        transform: translateY(110%);
        transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .text-reveal-line.revealed span {
        transform: translateY(0);
      }

      /* ── SHIMMER BADGE ── */
      @keyframes shimmer {
        0%   { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      .shimmer-text {
        background: linear-gradient(90deg, #d5cec0 0%, #f2f0eb 40%, #a3967f 60%, #d5cec0 100%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: shimmer 4s linear infinite;
      }

      /* ── BUTTON GLOW ── */
      .btn-glow {
        position: relative;
        overflow: hidden;
      }
      .btn-glow::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        background: rgba(255,255,255,0.15);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        transition: width 0.6s ease, height 0.6s ease;
        pointer-events: none;
      }
      .btn-glow:hover::before {
        width: 300px;
        height: 300px;
      }

      /* ── SMOOTH PAGE TRANSITION ── */
      @keyframes page-in {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes page-out {
        from { opacity: 1; transform: translateY(0); }
        to   { opacity: 0; transform: translateY(-8px); }
      }
      .page-enter { animation: page-in 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .page-exit  { animation: page-out 0.3s ease-in forwards; }

      /* ── CARD TILT (desktop) ── */
      .tilt-card {
        transform-style: preserve-3d;
        transition: transform 0.2s ease;
      }

      /* ── HOVER UNDERLINE ── */
      .hover-line {
        position: relative;
      }
      .hover-line::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 1px;
        background: currentColor;
        transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .hover-line:hover::after { width: 100%; }

      /* ── FLOATING DOT PULSE ── */
      @keyframes dot-ping {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.8); opacity: 0; }
      }
      .dot-ping { animation: dot-ping 2s ease-in-out infinite; }

      /* ── STAGGER FADE ── */
      @keyframes stagger-in {
        from { opacity: 0; transform: translateY(16px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      .stagger-item { opacity: 0; }
      .stagger-item.visible {
        animation: stagger-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* ── SCROLL PROGRESS ── */
      .scroll-progress {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        background: linear-gradient(90deg, #a3967f, #d5cec0);
        transition: width 0.1s linear;
        z-index: 10000;
      }
    </style>
